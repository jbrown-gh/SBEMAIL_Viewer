<html><head><title>SBEMAIL Player</title>
<script type="text/javascript">
var maxEmail = 210;
var baseUrl = "http://www.homestarrunner.com/";

function GetUrl(email)
{
	var url = "";
	var page = "";
	
	if(email == 100) page = "sbemails/100-flashback";
	else if(email == 151) page = "sbemails/151-senior-prom";
	else if(email == 200) page = "sbemails/200-email-thunder";
	else if(email == 201) page = "sbemails/201-hremail-3184";
	else page = "sbemail" + email + ".html";
	
	url = baseUrl + page;
	
	return url;
}

function UpdateScreen(email)
{
	var newEmail = email;
	
	if(isNaN(email) || email < 1) newEmail = 1;
	else if(email > maxEmail) newEmail = maxEmail;
	
	document.getElementById("text_email").value = newEmail;
	
	var frame = document.getElementById("iframe");
	
	frame.src = GetUrl(newEmail);
}

function Next()
{
	var email = parseInt(document.getElementById("text_email").value);
	
	UpdateScreen(email + 1);	
}

function Previous()
{
	var email = parseInt(document.getElementById("text_email").value);
	
	UpdateScreen(email - 1);
}	

function JumpToEmail()
{
	var email = parseInt(document.getElementById("text_email").value);
	
	UpdateScreen(email);
}
</script>
</head>
<body bgcolor="#000000" color="#000000">
	<center>
		<table width="100%">
			<tr>
				<td>
					<center>
						<input type="button" id="previous" value="Previous" onClick="Previous();"></input>
						<font color="white"> Current Email: </font>
						<input type="text" id="text_email" value="0" width="2">
						<input type="button" id="jump" value="Jump to Email" onClick="JumpToEmail();"></input>
						<input type="button" id="next" value="Next" onClick="Next();"></input>
					</center>
				</td>
			</tr>
			<tr>
				<td>
					<center>
						<div id="player">
							<iframe id="iframe" height="525" width="950" frameborder="0" border="0" marginwidth="0" marginheight="0" scrolling="no" src=""></iframe>
						</div>
					</center>
				</td>
			</tr>
		</table>
	</center>
</body>
</html>
